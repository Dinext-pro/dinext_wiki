name: Dinext acceptance
on:
  pull_request:
    branches: ['dinext/main/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dinext-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: compatibility
            name: Compatibility acceptance
          - phase: browser
            name: Cypress acceptance
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -pci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install bench prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat
          npm install --global yarn@1.22.22
      - name: Run acceptance suite on a synthetic site
        env:
          DINEXT_NOTIFICATIONS_ENABLED: 'false'
          DINEXT_DOCS_AGENT_ENABLED: '0'
          DINEXT_WIKI_PUBLISH_ENABLED: '0'
        run: bash .github/ci/run-acceptance.sh '${{ matrix.phase }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-${{ matrix.phase }}
          path: ${{ runner.temp }}/dinext-acceptance-results
          if-no-files-found: warn
          retention-days: 14
